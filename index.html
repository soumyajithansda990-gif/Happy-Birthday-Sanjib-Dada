<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Dada!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Trebuchet MS', sans-serif;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #090979, #500080, #ff0080);
    background-size: 300% 300%;
    animation: bg 8s infinite alternate;
}

@keyframes bg {
    0% {background-position: 0% 50%;}
    100% {background-position: 100% 50%;}
}

.container {
    position: relative;
    z-index: 2;
    padding: 35px 15px;
    margin-top: 5vh;
}

.date {
    color: #ffe66d;
    letter-spacing: 4px;
    font-size: 18px;
}

h1 {
    margin: 20px 0;
    font-size: clamp(35px, 8vw, 65px);
    color: #fff;
    text-shadow: 0 0 10px #ff00de,
                 0 0 25px #ff00de,
                 0 0 45px #ff00de;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from {transform: scale(1);}
    to {transform: scale(1.06);}
}

.subtitle {
    font-size: 20px;
    color: #fff5c3;
    margin-bottom: 25px;
}

.cake {
    font-size: 100px;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    0%, 100% {transform: translateY(0);}
    50% {transform: translateY(-18px);}
}

button {
    padding: 14px 28px;
    margin: 12px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ffcc00, #ff5e62);
    color: #321044;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px #ffcc00;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

#message {
    display: none;
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ffffff80;
    border-radius: 20px;
    background: #ffffff20;
    backdrop-filter: blur(8px);
    font-size: 20px;
    line-height: 1.6;
    animation: appear 1s;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

.balloon {
    position: absolute;
    bottom: -120px;
    font-size: 45px;
    animation: fly 9s linear infinite;
    z-index: 1;
}

@keyframes fly {
    to {transform: translateY(-120vh) rotate(20deg);}
}

.confetti {
    position: absolute;
    top: -20px;
    width: 9px;
    height: 14px;
    animation: fall 4s linear infinite;
}

@keyframes fall {
    to {transform: translateY(110vh) rotate(720deg);}
}

footer {
    margin-top: 25px;
    color: #ffe6f7;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="date">🎉 12 NOVEMBER 🎉</div>

    <h1>HAPPY BIRTHDAY<br>DADA! ❤️</h1>

    <p class="subtitle">
        Today is your special day! ✨
    </p>

    <div class="cake">🎂</div>

    <h2>May Your Life Be Full Of Happiness!</h2>

    <button onclick="showWish()">
        🎁 Open Your Surprise
    </button>

    <div id="message">
        🎉 Happy Birthday, Dada! 🎉<br>
        May your every dream come true.<br>
        Keep smiling, keep shining and enjoy your special day! ❤️<br>
        You deserve all the happiness in the world! 🥳
    </div>

    <footer>
        Made with ❤️ Just for You
    </footer>

</div>

<script>
function showWish() {
    document.getElementById("message").style.display = "block";
    launchConfetti();

    const btn = document.querySelector("button");
    btn.innerText = "🎉 Surprise Unlocked!";
}

function launchConfetti() {
    for (let i = 0; i < 100; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            ["#ff0", "#ff0080", "#00ffff", "#fff", "#00ff66"]
            [Math.floor(Math.random() * 5)];

        confetti.style.animationDelay = Math.random() * 3 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }
}

// Floating balloons
const balloons = ["🎈", "🎈", "🎈", "🎊", "🎈", "🎉"];

balloons.forEach((emoji, i) => {
    let balloon = document.createElement("div");
    balloon.className = "balloon";
    balloon.innerText = emoji;
    balloon.style.left = (i * 17) + "%";
    balloon.style.animationDelay = (i * 1.2) + "s";
    document.body.appendChild(balloon);
});

// Initial confetti
launchConfetti();
</script>

</body>
</html>
